version: 1
send_anonymous_usage_stats: true
project_id: tap-jira
default_environment: dev
plugins:
  extractors:
  - name: tap-jira
    namespace: tap_jira
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    - structured-logging
    settings_group_validation:
    - [domain, api_token, email]
    settings:
    - name: start_date
      kind: date_iso8601
      description: Earliest record date to sync
    - name: end_date
      kind: date_iso8601
      description: Latest record date to sync
    - name: domain
      kind: string
      description: The Domain for your Jira account, e.g. meltano.atlassian.net
    - name: api_token
      kind: string
      description: Jira API Token
      sensitive: true
    - name: email
      kind: string
      description: The user email for your Jira account
    - name: cloud_id
      kind: string
      description: The Cloud ID for your Jira account (optional - uses cloud-based API URLs)
    - name: page_size.issues
      kind: integer
      value: 100
      description: Page size for issues stream
    - name: stream_options.issues.jql
      kind: string
      description: A JQL query to filter issues
    - name: backfill.project
      kind: string
      description: Jira project key (or numeric project ID) to backfill in a one-off run
    - name: backfill.start_date
      kind: date_iso8601
      description: Start of the one-off backfill window (defaults to start_date)
    - name: backfill.end_date
      kind: date_iso8601
      description: End of the one-off backfill window (defaults to end_date)
    - name: backfill_project
      kind: string
      description: Shorthand for backfill.project
    - name: backfill_start_date
      kind: date_iso8601
      description: Shorthand for backfill.start_date
    - name: backfill_end_date
      kind: date_iso8601
      description: Shorthand for backfill.end_date
    - name: include_audit_logs
      kind: boolean
      value: false
      description: Include the audit logs stream
environments:
- name: dev
- name: staging
- name: prod
venv:
  backend: uv
